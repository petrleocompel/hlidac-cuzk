name: Setup pnpm workspace
description: Install the pinned pnpm, Node.js and locked dependencies.

inputs:
  node-version:
    description: Node.js version (defaults to .nvmrc)
    default: ''

runs:
  using: composite
  steps:
    # Version comes from packageManager in package.json.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
