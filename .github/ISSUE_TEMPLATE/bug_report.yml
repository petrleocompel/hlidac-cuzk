name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems belong to [private reporting](https://github.com/petrleocompel/hlidac-cuzk/security/advisories/new), not here.
        Redact secrets, e-mail addresses and personal data from logs.
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or image digest
      placeholder: ghcr.io/petrleocompel/hlidac-cuzk@sha256:… or 0.1.0
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose (loopback / LAN)
        - Docker Compose behind a reverse proxy
        - External PostgreSQL
        - Local development
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant output of `pnpm run doctor` / logs
      render: text
