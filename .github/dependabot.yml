version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: [/, /deploy]
    schedule:
      interval: weekly
    # Node and PostgreSQL majors need a deliberate upgrade (runtime support, pg_upgrade).
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    # Node and PostgreSQL majors need a deliberate upgrade (runtime support, pg_upgrade).
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
