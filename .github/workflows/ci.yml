name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: ESLint
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Generate routes
        run: pnpm generate-routes
      - name: TypeScript
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: integration-test-only
          POSTGRES_DB: hlidac_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:integration-test-only@127.0.0.1:5432/hlidac_test_ci
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Backup tests drive the real pg_dump/pg_restore and restic binaries.
      - name: Install PostgreSQL 16 client and restic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends postgresql-client-16 restic
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm test:integration

      - name: Backup and restore tests
        run: pnpm test:backup

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: output
          path: .output
          retention-days: 7
          if-no-files-found: error
