# Standalone stack for external PostgreSQL. Do NOT combine with docker-compose.yml.
# Combine with selfhost.yml or proxy.yml to expose the web service.
x-runtime: &runtime
  image: ${HLIDAC_CUZK_IMAGE:?set a tested image tag or digest}
  env_file: [.env]
  environment: &environment
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?set the external PostgreSQL URL}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
    BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL}
    CUZK_API_KEY: ${CUZK_API_KEY:?set CUZK_API_KEY}

services:
  migrate:
    <<: *runtime
    restart: "no"
    command: ["pnpm", "bootstrap"]
  app:
    <<: *runtime
    restart: unless-stopped
    environment:
      <<: *environment
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  cron:
    <<: *runtime
    restart: unless-stopped
    stop_grace_period: 5m
    command: ["pnpm", "cron"]
    depends_on:
      migrate:
        condition: service_completed_successfully
