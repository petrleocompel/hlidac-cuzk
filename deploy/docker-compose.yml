# Base stack. Every overlay builds on this one.
#
#   Local db:
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d db
#
#   Peelco test:
#     docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.test.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hlidac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hlidac}
      POSTGRES_DB: ${POSTGRES_DB:-hlidac_cuzk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hlidac}"]
      interval: 5s
      retries: 5

  migrate:
    image: ${HLIDAC_CUZK_IMAGE:-hlidac-cuzk:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: "no"
    command: ["pnpm", "db:migrate"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hlidac}:${POSTGRES_PASSWORD:-hlidac}@db:5432/${POSTGRES_DB:-hlidac_cuzk}}
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ${HLIDAC_CUZK_IMAGE:-hlidac-cuzk:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hlidac}:${POSTGRES_PASSWORD:-hlidac}@db:5432/${POSTGRES_DB:-hlidac_cuzk}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://${APP_HOST:?set APP_HOST to your domain}}
      CUZK_API_KEY: ${CUZK_API_KEY:?set CUZK_API_KEY}
      CUZK_API_BASE_URL: ${CUZK_API_BASE_URL:-https://api-kn.cuzk.gov.cz}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  cron:
    image: ${HLIDAC_CUZK_IMAGE:-hlidac-cuzk:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["pnpm", "cron"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-hlidac}:${POSTGRES_PASSWORD:-hlidac}@db:5432/${POSTGRES_DB:-hlidac_cuzk}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:-https://${APP_HOST:?set APP_HOST to your domain}}
      CUZK_API_KEY: ${CUZK_API_KEY:?set CUZK_API_KEY}
      CUZK_API_BASE_URL: ${CUZK_API_BASE_URL:-https://api-kn.cuzk.gov.cz}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
